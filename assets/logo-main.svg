<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.5"/>
    </linearGradient>
  </defs>

  <!-- Orbital ring 1 - tilted ellipse -->
  <ellipse cx="256" cy="256" rx="150" ry="80" fill="none" stroke="url(#orbit-grad)" stroke-width="8" transform="rotate(-35 256 256)"/>

  <!-- Orbital ring 2 - tilted ellipse opposite -->
  <ellipse cx="256" cy="256" rx="150" ry="80" fill="none" stroke="url(#orbit-grad)" stroke-width="8" transform="rotate(35 256 256)"/>

  <!-- Eye shape - outer -->
  <path d="M56 256 Q256 120 456 256 Q256 392 56 256Z" fill="none" stroke="#3b1f8e" stroke-width="10" stroke-linejoin="round"/>

  <!-- Iris -->
  <circle cx="256" cy="256" r="45" fill="#5b3cc4" stroke="#3b1f8e" stroke-width="6"/>

  <!-- Pupil -->
  <circle cx="256" cy="256" r="20" fill="white"/>

  <!-- Orbital dot top -->
  <circle cx="310" cy="155" r="12" fill="#7c5ce0"/>

  <!-- Orbital dot bottom -->
  <circle cx="202" cy="357" r="10" fill="#a78bfa"/>
</svg>
